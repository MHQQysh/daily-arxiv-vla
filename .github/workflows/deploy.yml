name: 部署到 GitHub Pages

on:
  workflow_dispatch:
    inputs:
      add_new_papers:
        description: '新增最多 20 篇论文（不勾选则只验证爬虫并刷新现有内容）'
        required: false
        type: boolean
        default: false
  push:
    branches: [ master, main ]
  schedule:
    # 临时自动触发验证：2026-08-27 北京时间 22:54（UTC 14:54）。
    - cron: '54 14 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # 不要让后续 push 抢占正在抓取论文的手动/定时任务。
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        
      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 运行单元测试
        run: python -m unittest discover -s tests -v

      - name: 安装 Playwright 依赖
        run: |
          npm install
          npx playwright install --with-deps chromium
          
      - name: 运行 arXiv 爬虫
        timeout-minutes: 6
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.add_new_papers }}" = "true" ]; }; then
            python -u scripts/arxiv_crawler.py
          else
            ARXIV_DAILY_RESULTS=20 python -u scripts/arxiv_crawler.py --dry-run
          fi
        env:
          ARXIV_INIT_RESULTS: 80
          ARXIV_INIT_TOTAL_LIMIT: 100
          ARXIV_DAILY_RESULTS: 80
          ARXIV_DAILY_TOTAL_LIMIT: 20
          ARXIV_PAGE_SIZE: 20
          ARXIV_DELAY_SECONDS: 3
          ARXIV_REQUEST_TIMEOUT_SECONDS: 10
          ARXIV_RETRY_BASE_SECONDS: 5
          ARXIV_MAX_RETRIES: 2

      - name: 使用 DeepSeek Flash 生成论文摘要
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "未配置 DEEPSEEK_API_KEY，本次保留待生成摘要并继续部署"
            exit 0
          fi
          python scripts/generate_summaries.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          DEEPSEEK_MODEL: deepseek-v4-flash
          SUMMARY_WORKERS: 5
          SUMMARY_MAX_ITEMS: 100
          SUMMARY_MAX_TOKENS: 2048

      - name: 抓取论文首图
        run: |
          python scripts/fetch_paper_images.py --max-items 100

      - name: 生成首图截图兜底队列
        run: |
          python scripts/build_paper_image_fallback_queue.py --max-items 100

      - name: Playwright 截图兜底
        run: |
          npm run paper-image:fallbacks

      - name: 注册截图兜底首图
        run: |
          python scripts/register_paper_image_fallbacks.py
          
      - name: 检查 Google Analytics 配置
        run: |
          if [ -n "$GA_MEASUREMENT_ID" ]; then
            echo "已读取 GA_MEASUREMENT_ID（值不会打印）"
          else
            echo "未读取 GA_MEASUREMENT_ID，网站将不加载 GA4"
          fi
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID || secrets.GA_MEASUREMENT_ID }}

      - name: 构建网站
        run: |
          python scripts/build_site.py
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID || secrets.GA_MEASUREMENT_ID }}

      - name: 提交更改
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add papers.md
          git add -f site
          if git diff --staged --quiet; then
            echo "没有更改需要提交"
          else
            CURRENT_DATE=$(date '+%Y-%m-%d')
            git commit -m "自动更新：爬取新论文并生成摘要 - $CURRENT_DATE [skip ci]"
            git push
          fi
          
      - name: 设置 Pages
        uses: actions/configure-pages@v5
        
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
